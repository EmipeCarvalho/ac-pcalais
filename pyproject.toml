[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "menu-atlas"
version = "1.0.0"
description = "Extração e qualidade de dados de cardápios com Prefect, Gemini e Great Expectations"
requires-python = ">=3.11,<3.14"
dependencies = ["prefect>=3.4,<4", "great_expectations>=1.5,<2", "streamlit>=1.45,<2", "google-genai>=1.20,<2", "pandas>=2.2,<3", "pillow>=11,<13", "python-dotenv>=1,<2", "requests>=2.32,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["menu_atlas*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
